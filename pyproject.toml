[project]
name = "repomind-ai"
version = "1.0.0"
description = "Autonomous AI agent that analyzes GitHub repositories, detects runtime bugs, generates fixes, validates them in a sandbox, and creates pull requests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Satyam Kumar" }
]
keywords = ["ai", "agent", "debugging", "langgraph", "groq", "autonomous"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "streamlit>=1.33.0",
    "gitpython>=3.1.41",
    "python-dotenv>=1.0.1",
    "langchain>=0.1.16",
    "langchain-core>=0.1.46",
    "langchain-groq>=0.1.3",
    "pytest>=8.1.1",
    "PyGithub>=2.3.0",
    "chromadb>=0.5.0",
    "pydantic>=2.6.4",
    "requests>=2.31.0",
    "langgraph>=0.0.48",
    "ruff>=0.15.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/k-satyam215/repomind-ai"
Repository = "https://github.com/k-satyam215/repomind-ai"
Issues = "https://github.com/k-satyam215/repomind-ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]
