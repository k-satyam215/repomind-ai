version: "3.9"

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repomind-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - MCP_URL=http://mcp:9000/tool
      - BACKEND_URL=http://backend:8000
    volumes:
      - .:/app
      - repomind_memory:/app/repomind_memory
      - repomind_logs:/app/logs
    depends_on:
      - mcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── MCP Tool Server ──────────────────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repomind-mcp
    command: uvicorn src.mcp.server:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - repomind_memory:/app/repomind_memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Streamlit Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repomind-frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - BACKEND_URL=http://backend:8000
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  repomind_memory:
  repomind_logs:
