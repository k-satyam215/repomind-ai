name: Deploy to HuggingFace Spaces

on:
  push:
    tags:
      - "v*.*.*"          # deploy on version tags: v1.2.0, v1.3.0, etc.
  workflow_dispatch:      # allow manual trigger from GitHub Actions UI

jobs:
  deploy-hf:
    name: Push to HuggingFace Spaces
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git for HF push
        run: |
          git config --global user.email "ci@repomind.ai"
          git config --global user.name "RepoMind CI"

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}   # e.g. satyam215/repomind-ai
        run: |
          git remote add hf https://satyam215:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
          git push hf HEAD:main --force
