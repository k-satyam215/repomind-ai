name: Deploy to HuggingFace Spaces

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  deploy-hf:
    name: Push to HuggingFace Spaces
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "ci@repomind.ai"
          git config --global user.name "RepoMind CI"

      - name: Push to HuggingFace Spaces (exclude large files)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          # Create a fresh orphan branch with only current files (no history with large files)
          git checkout --orphan hf-deploy-branch
          
          # Remove large media files
          rm -f assets/demo.mp4 assets/demo.gif
          
          git add .
          git commit -m "deploy: RepoMind AI v$(git describe --tags --abbrev=0 2>/dev/null || echo 'latest')"
          
          git remote add hf https://Satyam970:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
          git push hf hf-deploy-branch:main --force
