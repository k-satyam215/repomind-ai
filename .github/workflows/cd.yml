name: CD — Publish to Docker Hub

on:
  push:
    tags:
      - "v*.*.*"

jobs:

  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKERHUB_USERNAME != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/repomind-ai:${{ steps.meta.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/repomind-ai:latest

      - name: Verify push
        run: echo "✅ Pushed repomind-ai:${{ steps.meta.outputs.VERSION }} to Docker Hub"
