<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg)" rx="16"/>
  <rect width="900" height="620" fill="none" stroke="#334155" stroke-width="1.5" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">RepoMind AI — System Architecture</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="#64748b">Autonomous Software Engineering Agent · v1.2.0</text>

  <!-- ── USER INPUT (top) ── -->
  <rect x="340" y="72" width="220" height="44" rx="10" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="450" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="white">👤 User</text>
  <text x="450" y="106" text-anchor="middle" font-size="10" fill="#e0e7ff">GitHub URL via Streamlit UI</text>

  <!-- ── STREAMLIT FRONTEND ── -->
  <rect x="60" y="72" width="200" height="44" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#818cf8">Streamlit Frontend</text>
  <text x="160" y="106" text-anchor="middle" font-size="10" fill="#94a3b8">Analyze · Severity Badges · Metrics Tab</text>

  <!-- ── FASTAPI BACKEND ── -->
  <rect x="340" y="150" width="220" height="44" rx="10" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="450" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="white">⚡ FastAPI Backend :8000</text>
  <text x="450" y="184" text-anchor="middle" font-size="10" fill="#cffafe">/analyze · /fix · /diff · /metrics</text>

  <!-- ── LANGGRAPH AGENT GRAPH ── -->
  <rect x="260" y="228" width="380" height="200" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#818cf8">🔄 LangGraph Agent Graph</text>
  <text x="450" y="263" text-anchor="middle" font-size="10" fill="#64748b">Multi-Issue Loop · Stateful · Reflection-Driven</text>

  <!-- Graph nodes -->
  <rect x="275" y="272" width="76" height="30" rx="7" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="313" y="292" text-anchor="middle" font-size="10" fill="#c7d2fe">analyze</text>

  <rect x="361" y="272" width="68" height="30" rx="7" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="395" y="292" text-anchor="middle" font-size="10" fill="#c7d2fe">fix</text>

  <rect x="439" y="272" width="76" height="30" rx="7" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="477" y="292" text-anchor="middle" font-size="10" fill="#c7d2fe">patch</text>

  <rect x="525" y="272" width="68" height="30" rx="7" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="559" y="292" text-anchor="middle" font-size="10" fill="#c7d2fe">test</text>

  <rect x="387" y="318" width="80" height="30" rx="7" fill="#312e81" stroke="#a855f7" stroke-width="1.5"/>
  <text x="427" y="338" text-anchor="middle" font-size="10" fill="#e9d5ff">reflect</text>

  <rect x="340" y="360" width="80" height="28" rx="7" fill="#1e3a5f" stroke="#0891b2" stroke-width="1"/>
  <text x="380" y="379" text-anchor="middle" font-size="10" fill="#bae6fd">planner</text>

  <rect x="480" y="360" width="80" height="28" rx="7" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="520" y="379" text-anchor="middle" font-size="10" fill="#a7f3d0">finalize</text>

  <!-- Arrows inside graph -->
  <line x1="351" y1="287" x2="360" y2="287" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="429" y1="287" x2="438" y2="287" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="515" y1="287" x2="524" y2="287" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="559" y1="302" x2="440" y2="318" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="427" y1="348" x2="395" y2="360" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <!-- retry loop -->
  <path d="M380 360 Q310 350 313 302" stroke="#f59e0b" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>
  <text x="290" y="340" font-size="9" fill="#f59e0b">retry</text>
  <line x1="427" y1="348" x2="490" y2="360" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="450" y="358" font-size="9" fill="#10b981">done</text>

  <!-- ── LEFT COLUMN: MCP + Memory ── -->
  <!-- MCP Tool Server -->
  <rect x="60" y="228" width="170" height="52" rx="10" fill="#1e293b" stroke="#0891b2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#67e8f9">🔧 MCP Server :9000</text>
  <text x="145" y="264" text-anchor="middle" font-size="9" fill="#94a3b8">read_file · apply_patch</text>
  <text x="145" y="277" text-anchor="middle" font-size="9" fill="#94a3b8">run_tests · sandboxed</text>

  <!-- Vector Memory -->
  <rect x="60" y="300" width="170" height="52" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#d8b4fe">🧠 Memory</text>
  <text x="145" y="336" text-anchor="middle" font-size="9" fill="#94a3b8">ChromaDB vector store</text>
  <text x="145" y="350" text-anchor="middle" font-size="9" fill="#94a3b8">JSON key-value store</text>

  <!-- Groq LLM -->
  <rect x="60" y="372" width="170" height="44" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#fde68a">⚡ Groq LLM</text>
  <text x="145" y="408" text-anchor="middle" font-size="9" fill="#94a3b8">llama-3.3-70b-versatile</text>

  <!-- ── RIGHT COLUMN: Observability + GitHub ── -->
  <!-- Observability -->
  <rect x="670" y="228" width="180" height="64" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="249" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">📊 Observability</text>
  <text x="760" y="265" text-anchor="middle" font-size="9" fill="#94a3b8">Fix rate · Retry distribution</text>
  <text x="760" y="279" text-anchor="middle" font-size="9" fill="#94a3b8">Stage latency · Severity split</text>
  <text x="760" y="289" text-anchor="middle" font-size="9" fill="#6ee7b7">GET /metrics</text>

  <!-- GitHub PR -->
  <rect x="670" y="312" width="180" height="52" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#e2e8f0">🐙 GitHub</text>
  <text x="760" y="349" text-anchor="middle" font-size="9" fill="#94a3b8">Auto PR creation</text>
  <text x="760" y="362" text-anchor="middle" font-size="9" fill="#94a3b8">No force-push on main</text>

  <!-- CI/CD -->
  <rect x="670" y="384" width="180" height="44" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#fed7aa">⚙️ CI/CD</text>
  <text x="760" y="419" text-anchor="middle" font-size="9" fill="#94a3b8">Lint · Tests · Docker push on tag</text>

  <!-- ── DOCKER COMPOSE WRAPPER ── -->
  <rect x="60" y="452" width="780" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="471" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">🐳 Docker Compose — 3 Services</text>
  <text x="250" y="490" text-anchor="middle" font-size="10" fill="#64748b">Backend :8000</text>
  <text x="450" y="490" text-anchor="middle" font-size="10" fill="#64748b">MCP Server :9000</text>
  <text x="660" y="490" text-anchor="middle" font-size="10" fill="#64748b">Streamlit :8501</text>

  <!-- ── LEGEND ── -->
  <rect x="60" y="522" width="780" height="80" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="100" y="541" font-size="10" font-weight="700" fill="#64748b">LEGEND</text>
  <rect x="100" y="550" width="12" height="12" rx="3" fill="url(#purple)"/>
  <text x="118" y="561" font-size="9" fill="#94a3b8">Agent pipeline</text>
  <rect x="220" y="550" width="12" height="12" rx="3" fill="url(#teal)"/>
  <text x="238" y="561" font-size="9" fill="#94a3b8">API layer</text>
  <rect x="320" y="550" width="12" height="12" rx="3" fill="url(#green)"/>
  <text x="338" y="561" font-size="9" fill="#94a3b8">Success path</text>
  <rect x="430" y="550" width="12" height="12" rx="3" fill="url(#amber)"/>
  <text x="448" y="561" font-size="9" fill="#94a3b8">Retry loop</text>
  <text x="100" y="590" font-size="9" fill="#475569">70 tests · 0 warnings · Confidence-scored bug detection · Multi-issue parallel fixing · Sandbox isolation</text>

  <!-- ── MAIN FLOW ARROWS ── -->
  <!-- User → Frontend -->
  <line x1="340" y1="94" x2="260" y2="94" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- User → Backend -->
  <line x1="450" y1="116" x2="450" y2="150" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Frontend → Backend -->
  <line x1="160" y1="116" x2="160" y2="188" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="160" y1="188" x2="340" y2="168" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- Backend → Graph -->
  <line x1="450" y1="194" x2="450" y2="228" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Graph ↔ MCP -->
  <line x1="260" y1="285" x2="230" y2="262" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="270" x2="260" y2="295" stroke="#0891b2" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Graph ↔ Memory -->
  <line x1="260" y1="330" x2="230" y2="325" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Graph ↔ LLM -->
  <line x1="290" y1="380" x2="230" y2="392" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <!-- Graph → Observability -->
  <line x1="640" y1="300" x2="670" y2="268" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- finalize → GitHub -->
  <line x1="640" y1="395" x2="670" y2="345" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
